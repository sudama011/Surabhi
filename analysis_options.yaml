# Dart & Flutter Static Analysis Configuration
# Configures the analyzer for error detection, warnings, and lints
# Run: flutter analyze

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Enforce consistent code style
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true

    # Code quality
    avoid_print: true  # Allow print statements for debugging
    avoid_unnecessary_containers: true
    avoid_web_libraries_in_flutter: true

    # Architecture
    use_build_context_synchronously: true # Prevents crashes in async UI code

    # Documentation
    public_member_api_docs: false  # Disable for internal project

analyzer:
  # Exclude generated files from analysis
  exclude:
    - lib/**.g.dart
    - lib/**.freezed.dart
    - build/**
    - android/**
    - ios/**
    - web/**

  # Disable strict checking for this project
  language:
    strict-casts: false
    strict-inference: false
    strict-raw-types: false

formatter:
  page_width: 120
